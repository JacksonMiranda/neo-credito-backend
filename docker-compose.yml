services:
  postgres:
    image: postgres:16-alpine
    container_name: neo-credito-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neocredito
      POSTGRES_PASSWORD: neocredito
      POSTGRES_DB: neocredito
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neocredito -d neocredito"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: neo-credito-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://neocredito:neocredito@postgres:5432/neocredito?schema=public"
      JWT_SECRET: "troque-este-segredo"
      JWT_EXPIRES_IN: "8h"
      AUTH_LOGIN_RATE_LIMIT_MAX: 10
      AUTH_LOGIN_RATE_LIMIT_WINDOW_MS: 60000
      SEED_DATABASE: "true"
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
